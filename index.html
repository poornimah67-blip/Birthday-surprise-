<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Nishanth!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
    radial-gradient(circle at 50% 40%, #fff8fa 0%, #fcecf1 38%, transparent 68%),
    radial-gradient(circle at 0% 0%, #e9b8c5 0%, transparent 42%),
    radial-gradient(circle at 100% 0%, #f3cbd5 0%, transparent 42%),
    radial-gradient(circle at 0% 100%, #d99aaa 0%, transparent 45%),
    radial-gradient(circle at 100% 100%, #e8b3c1 0%, transparent 45%),
    linear-gradient(135deg, #fdf1f4, #f3d5dd);
            font-family: Georgia, serif;
            text-align: center;
            color: #5a4a50;
            overflow-x: hidden;
        }

        .heart {
            font-size: 45px;
            margin-top: 15px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            color: #9f5965;
            font-size: 28px;
            margin: 10px 15px 20px;
        }

        h2 {
            color: #5a4a50;
            font-size: 20px;
        }

        p {
            font-size: 15px;
            line-height: 1.8;
            margin: 18px 20px;
        }

        button {
            background: #bd7180;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: Georgia, serif;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(100, 60, 70, 0.15);
        }

        button:active {
            transform: scale(0.96);
        }

        #surprise {
            margin: 20px;
            font-style: italic;
            color: #8d6570;
        }

        #aiBox {
            width: 92%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #f0d1da;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(100, 60, 70, 0.15);
            display: none;
        }

        #aiText {
            font-size: 15px;
            line-height: 1.8;
        }

        #tellButton {
            display: none;
            margin-top: 15px;
        }

        .my-message {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
            color: #9f5965;
        }

        .footer-message {
            text-align: center;
            margin: 40px 0 25px;
            font-family: Georgia, serif;
            font-size: 15px;
            color: #9b6570;
            opacity: 0.9;
        }

        /* Floating emojis */
        .floating {
            position: fixed;
            bottom: -60px;
            font-size: 38px;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            animation: floatEmoji 7s linear infinite;
        }

        @keyframes floatEmoji {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.85;
            }

            50% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-115vh) rotate(25deg);
                opacity: 0;
            }
        }

        .e1 {
            left: 8%;
            animation-delay: 0s;
        }

        .e2 {
            left: 23%;
            animation-delay: 2s;
        }

        .e3 {
            left: 40%;
            animation-delay: 4s;
        }

        .e4 {
            left: 58%;
            animation-delay: 1s;
        }

        .e5 {
            left: 73%;
            animation-delay: 3s;
        }

        .e6 {
            left: 87%;
            animation-delay: 5s;
        }

        .e7 {
            left: 50%;
            animation-delay: 6s;
        }
        .footer-message {
    text-align: center;
    margin: 40px 0 25px;
    font-family: Georgia, serif;
    font-size: 15px;
    color: #9b6570;
    opacity: 0.9;
        }
        #photoSlideshow {
    display: none;
    width: 100%;
    text-align: center;
    margin: 35px auto 25px;
}

.photo-card {
    width: min(82vw, 430px);
    margin: 0 auto;
    padding: 7px;
    background: #ffffff;
    border: 1px solid rgba(120, 70, 80, 0.25);
    border-radius: 4px;
    box-shadow: 0 8px 25px rgba(80, 40, 50, 0.18);
    box-sizing: border-box;
}

.memory-photo {
    display: none;
    width: 100%;
    height: auto;
    max-height: 60vh;
    object-fit: contain;
}

.memory-photo.show {
    display: block;
}

.photo-dots {
    margin-top: 14px;
    text-align: center;
}

.photo-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 5px;
    border-radius: 50%;
    background: rgba(120, 80, 90, 0.35);
    transition: all 0.4s ease;
}

.photo-dot.active {
    width: 10px;
    height: 10px;
    background: #8f596b;
}
    </style>
</head>

<body>
    <audio id="bgMusic" loop>
    <source src="background .mp3" type="audio/mpeg">
    </audio>

    <div class="heart">💞</div>

    <!-- Floating emojis -->
    <div class="floating e1">🎊</div>
    <div class="floating e2">🥰</div>
    <div class="floating e3">❤️</div>
    <div class="floating e4">💫</div>
    <div class="floating e5">♥️</div>
    <div class="floating e6">✨</div>
    <div class="floating e7">🥳</div>

    <h1>Happy Birthday Nishanth! 🎂</h1>

    <p>Wishing you a very happy birthday! 🥳</p>

    <p>
        May your day be filled with happiness, smiles and lots of memories. ✨
    </p>

    <button onclick="alert('Have the best birthday ever! 🎁❤️')">
        Click Me 🎁
    </button>

    <h2>A Little Something For U 🫠</h2>

    <button onclick="showMessage()">
        Click here 👋
    </button>

    <p id="surprise"></p>

    <!-- AI BOX -->
    <div id="aiBox">

        <h2>🤖 Wait... The AI Wants To Talk 😂</h2>

        <p id="aiText">
            Someone has something to say... 👀
        </p>

        <button id="aiButton" onclick="startAI()">
            🤖 Start AI
        </button>

        <button id="tellButton" onclick="tellMe()">
            👀 Yes, tell me
        </button>

    </div>
    <script>
        function showMessage() {
    document.getElementById("surprise").innerHTML = 
        "You are a very special person!❤️🤍 Keep smiling and enjoy your beautiful day! 🥳";
    
    setTimeout(function() {
        document.getElementById("aiBox").style.display = "block";
    }, 1500);
}

let aiStarted = false;

function startAI() {
    if (aiStarted) return;
    aiStarted = true; // Fixed typo from 'asStarted'

    const displayText = 
        "Heyyyy... wait wait! 😮<br><br>" +
        "I know today is your birthday! 🥳🎂<br><br>" +
        "And don't worry, I won't bore you with a long speech. 😅<br><br>" +
        "I'm just here because someone gave me a small job... 👀<br><br>" +
        "Actually... they have a few things they want to tell you. ❤️<br><br>" +
        "Shall I tell you? 👀";

    const spokenText = 
        "Heyyyy... wait wait! " +
        "I know today is your birthday! " +
        "And don't worry, I won't bore you with a long speech. " +
        "I'm just here because someone gave me a small job. " +
        "Actually... they have a few things they want to tell you. " +
        "Shall I tell you?";

    document.getElementById("aiText").innerHTML = displayText;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(spokenText);
    
    voice.rate = 1.0; // Fixed invalid 0.0 rate
    voice.pitch = 1.05;
    voice.volume = 1;

    voice.onend = function() {
        document.getElementById("tellButton").style.display = "inline-block";
    };

    speechSynthesis.speak(voice);
    document.getElementById("aiButton").disabled = true;
}

function tellMe() {
    /* Play YOUR voice */
    // const audio = new Audio("myvoice.mp3.m4a"); // Check your file extension (.mp3 or .m4a)
    // audio.play();

    // Fixed CSS selector (added # for ID and matched camelCase 'aiBox')
    document.querySelector("#aiBox h2").style.display = "none";

    /* Hide buttons */
    document.getElementById("aiButton").style.display = "none";
    document.getElementById("tellButton").style.display = "none";

    /* Show your message */
    document.getElementById("aiText").innerHTML = 
        "<h2>Okay, enough from AI... now it's my turn. 🤭</h2>" +
    '<p>' +
    "Some people are special not because they try to be perfect, but because they are simply real. And honestly, that's something I genuinely appreciate about you.<br><br>" +

    "You've always been honest about who you are — your good side, your bad side, your strengths, and even your imperfections. Ninna bagge ninu enu hide madilla, I hope madodhu illa, and you never try to pretend to be someone else. Honestly, that kind of honesty is rare.<br><br>" +

    "One thing I've always noticed about you is enandre“You always try to make the people around you happy.” ❤️ and even the smallest smile or little happiness you bring to someone can mean a lot.<br><br>" +

    "I may not be able to give you everything you once hoped for, but I'm genuinely happy that I got to know the person behind everything — your honesty, kindness, caring and beautiful character.<br><br>" +

    "No matter where life takes you, I hope every dream you've been carrying in your heart slowly turns into reality. And never lose the qualities that make you you. 🥹<br><br>" +

    "May this birthday bring you countless reasons to smile. Keep smiling, keep making people around you happy, and never stop being the person you are.<br><br>" +

    "Even after everything, you still care, stay close, and hold on to a little hope — and that means a lot to me.<br><br>" +

    "I'm really glad to have you as a friend. ❤️<br><br>" +

    "once again, Happy Birthday. ❤️" +
    '</p>';
    setTimeout(function() {
        startPhotoSlideshow();
    }, 5000);
        }
        const bgMusic = document.getElementById("bgMusic");

bgMusic.volume = 0.12;

document.addEventListener("click", function () {
    bgMusic.play().catch(() => {});
}, { once: true });
        function startPhotoSlideshow() {

    const slideshow = document.getElementById("photoSlideshow");
    const photos = document.querySelectorAll(".memory-photo");
    const dots = document.querySelectorAll(".photo-dot");

    slideshow.style.display = "block";

    let current = 0;

    function showPhoto() {

        if (current >= photos.length) {
            return;
        }

        photos.forEach(function(photo) {
            photo.classList.remove("show");
        });

        dots.forEach(function(dot) {
            dot.classList.remove("active");
        });

        photos[current].classList.add("show");
        dots[current].classList.add("active");

        current++;

        if (current < photos.length) {
            setTimeout(showPhoto, 3000);
        }
    }

    showPhoto();
        }
    </script>
    <div id="photoSlideshow">

    <div class="photo-card">
        <img src="photo1.jpg" class="memory-photo">
        <img src="photo2.jpg" class="memory-photo">
        <img src="photo3.jpg" class="memory-photo">
        <img src="photo4.jpg" class="memory-photo">
    </div>

    <div class="photo-dots">
        <span class="photo-dot active"></span>
        <span class="photo-dot"></span>
        <span class="photo-dot"></span>
        <span class="photo-dot"></span>
    </div>

    </div>
    <div class="footer-message">
    Made with love, just for you ❤️
    </div>

</body>
</html>
