<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday 🎂</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d6eaff);
            padding: 50px 20px;
        }

        h1 {
            color: #ff4081;
            font-size: 40px;
        }

        p {
            font-size: 20px;
            color: #444;
        }

        .heart {
            font-size: 50px;
            animation: beat 1s infinite;
        }

        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
        }

        @keyframes beat {
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="heart">💞</div>

    <h1>Happy Birthday Nishanth! 🎂</h1>

    <p>Wishing you a very happy birthday!🥳</p>

    <p>May your day be filled with happiness, smiles and lots of memories. ✨</p>

    <button onclick="alert('Have the best birthday ever! 🎉❤️')">
        Click Me 🎁
    </button>

</body>
    <h2>A little somthing for U 🫶</h2>

<button onclick="showMessage()">click here 🤗</button>

<p id="surprise"></p>

<script>
function showMessage() {
    document.getElementById("surprise").innerHTML =
    "You are a very special person! 😊✨ Keep smiling and enjoy your beautiful day! 🎂🥳";
}
</script>
</html>
