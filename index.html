<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday 🎂</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d6eaff);
            padding: 50px 20px;
        }

        h1 {
            color: #ff4081;
            font-size: 40px;
        }

        p {
            font-size: 20px;
            color: #444;
        }

        .heart {
            font-size: 50px;
            animation: beat 1s infinite;
        }

        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
        }

        @keyframes beat {
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="heart">💞</div>

    <h1>Happy Birthday Nishanth! 🎂</h1>

    <p>Wishing you a very happy birthday!🥳</p>

    <p>May your day be filled with happiness, smiles and lots of memories. ✨</p>

    <button onclick="alert('Have the best birthday ever! 🎉❤️')">
        Click Me 🎁
    </button>
    <h2>A Little Something For U 💛</h2>

<button onclick="showMessage()">Click here 👋</button>

<p id="surprise"></p>

<div id="aiBox" style="display:none; margin-top:30px; padding:20px; background:white; border-radius:20px;">

    <h2>🤖 Wait... The AI Wants To Talk 😂</h2>

    <p id="aiText">Someone has something to say... 👀</p>
    
    <button id="aiButton" onclick="startAI()">🤖 Start AI</button>
    <button id="tellButton" onclick="tellMe()" style="display:none;">
    💌 Yes, tell me
    </button>

</div>

<script>

function showMessage() {

    document.getElementById("surprise").innerHTML =
    "You are a very special person! 💛✨ Keep smiling and enjoy your beautiful day! 🎂🥳";

    setTimeout(function() {
        document.getElementById("aiBox").style.display = "block";
    }, 1500);
}


let aiStarted = false;

function startAI() {

    if (aiStarted) return;

    aiStarted = true;

    const displayText =
        "Heyyy... wait wait wait! 😂👀<br><br>" +
        "I know today is your birthday! 🎂🥳<br><br>" +
        "And don't worry, I won't bore you with a long speech. 😂<br><br>" +
        "I'm just here because someone gave me a small job... 👀<br><br>" +
        "Actually... they have a few things they want to tell you. ❤️<br><br>" +
        "Shall I tell you? 👀";

    const spokenText =
        "Heyyy... wait wait wait! " +
        "I know today is your birthday! " +
        "And don't worry, I won't bore you with a long speech. " +
        "I'm just here because someone gave me a small job. " +
        "Actually, they have a few things they want to tell you. " +
        "Shall I tell you?";

    document.getElementById("aiText").innerHTML = displayText;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(spokenText);

    voice.rate = 0.9;
    voice.pitch = 1.05;
    voice.volume = 1;

    voice.onend = function() {
        document.getElementById("tellButton").style.display = "inline-block";
    };

    speechSynthesis.speak(voice);

    document.getElementById("aiButton").disabled = true;
}
function tellMe() {

    document.getElementById("tellButton").style.display = "none";

    const message =
        "Some people are special not because they try to be perfect, but because they are simply real. And honestly, that's something I genuinely appreciate about you.<br><br>" +

        "You've always been honest about who you are — your good side, your bad side, your strengths, and even your imperfections. " +
        "Ninna bagge ninu enu hide madilla, I hope madodhu illa, and you never try to pretend to be someone else. Honestly, that kind of honesty is rare.<br><br>" +

        "One thing I've always noticed about you is enandre, \"ninna sutha iro people happy aagirbeku anta neenu yavaglu try maadthiya,\" and even the smallest smile or little happiness you bring to someone can mean a lot.<br><br>" +

        "I may not be able to give you everything you once hoped for, but I'm genuinely happy that I got to know the person behind everything — your honesty, kindness, caring and important thing your beautiful character.<br><br>" +

        "No matter where life takes you, I hope every dream you've been carrying in your heart slowly turns into reality. And never lose the qualities that make you you.<br><br>" +

        "May this birthday bring you countless reasons to smile. Keep smiling, keep making people around you happy, and never stop being the person you are.<br><br>" +

        "Even after everything, you still care, stay close, and hold on to a little hope — and that means a lot to me.<br><br>" +

        "I'm really glad to have you as a friend.<br><br>" +

        "At last, I just want to say once again, Happy Birthday. ❤️";

    const textBox = document.getElementById("aiText");

    textBox.style.opacity = "0";
    textBox.innerHTML = message;

    setTimeout(function() {
        textBox.style.transition = "opacity 2s";
        textBox.style.opacity = "1";
    }, 100);
}


</script>
</html>
